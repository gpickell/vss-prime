[project]
name = "vss-prime"
version = "0.1.0"
description = "Manage VertiGIS Studio materials (certs, keys, accounts) on a remote /opt/vertigis-studio/ host."
requires-python = ">=3.11"
dependencies = [
    "questionary>=2.0",
    "sshconf>=0.2",
]

[project.scripts]
vss-prime = "vss_prime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vss_prime"]
